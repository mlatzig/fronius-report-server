# ###########################################################################
# Fronius Report Server - default configuration
#
# Do not put the settings of your installation here: copy
# local.properties.example to local.properties in the working directory
# (project directory or deployment directory) and override the keys there.
# ###########################################################################

spring.application.name=FroniusReportServer

# Settings of this installation, optional, override everything below.
spring.config.import=optional:file:./local.properties

# --- HTTP ------------------------------------------------------------------
server.port=8084

# --- Reports ---------------------------------------------------------------
# Root directory holding one sub directory per year with the CSV reports,
# e.g. /path/to/csv or C:/path/to/csv (forward slashes on Windows too).
fronius.csv-dir=

# Name of the pv plant, shown as tooltip of the branding.
fronius.plant-name=

# Shows a bundled, made up sample month as long as the CSV directory holds
# no report at all.
fronius.demo-fallback=true

# Periodic rescan of the report directory, keeps the cache warm.
# Default: five minutes past every hour. Use "-" to switch it off.
fronius.refresh-cron=0 5 * * * *

# Default size of a rendered chart in pixel.
fronius.chart-width=1100
fronius.chart-height=480

# --- CSV format ------------------------------------------------------------
# Solar.web localizes the exports. The defaults match the german export;
# for an export in another language set the file name and column headers
# of your files. Delimiter (, or ;), decimal separator and unit ([Wh] or
# [kWh]) are detected. A column header that is not found falls back to the
# usual position of the column (a warning is logged).
fronius.csv.file-pattern=Energiebilanz_Monatlicher_Report_{year}_{month}.csv
fronius.csv.date-format=dd.MM.yyyy
fronius.csv.columns.production=Gesamt Erzeugung
fronius.csv.columns.consumption=Gesamt Verbrauch
fronius.csv.columns.self-consumption=Eigenverbrauch
fronius.csv.columns.feed-in=Energie ins Netz eingespeist
fronius.csv.columns.grid-supply=Energie vom Netz bezogen

# --- View ------------------------------------------------------------------
# Language of the user interface: en (english) or de (german).
spring.web.locale=en
spring.web.locale-resolver=fixed
# The message files are encoded in ISO-8859-1, not in UTF-8.
spring.messages.basename=messages
spring.messages.encoding=ISO-8859-1
# an unknown locale falls back to the english base file, not to the system locale
spring.messages.fallback-to-system-locale=false
spring.thymeleaf.cache=false

# --- Logging ---------------------------------------------------------------
logging.level.de.latzig.tool.fronius=INFO
