<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:lang="${#locale.language}" lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title th:text="#{app.title} + ' · ' + ${report.title}">Fronius Report</title>
<link rel="stylesheet" th:href="@{/css/fronius.css}">
</head>
<body>

	<!-- One slim bar: the static branding and the period selector share a line.
	     Thin client: the form works without javascript, /select redirects to
	     the canonical path. With javascript the selection is applied in place. -->
	<header class="appbar">
		<span class="brand" th:title="${plantName}"> <span
			class="brand-mark">PV</span><span th:text="#{app.title}">Fronius
				Report</span>
		</span>

		<form id="selector" class="selector" method="get" th:action="@{/select}">
			<fieldset class="segment">
				<legend class="visually-hidden" th:text="#{selector.legend}">Period</legend>
				<input type="radio" name="view" id="view-overview" value="overview"
					th:checked="${report.view == 'overview'}"> <label
					for="view-overview" th:text="#{selector.view.overview}">Overview</label>
				<input type="radio" name="view" id="view-year" value="year"
					th:checked="${report.view == 'year'}"> <label for="view-year"
					th:text="#{selector.view.year}">Year</label> <input type="radio"
					name="view" id="view-month" value="month"
					th:checked="${report.view == 'month'}"> <label
					for="view-month" th:text="#{selector.view.month}">Month</label>
			</fieldset>

			<label class="visually-hidden" for="select-year"
				th:text="#{selector.year}">Year</label> <select class="select"
				name="year" id="select-year"
				th:disabled="${report.view == 'overview'}">
				<option th:each="y : ${report.years}" th:value="${y}" th:text="${y}"
					th:selected="${report.year != null and report.year == y}">2026</option>
			</select> <label class="visually-hidden" for="select-month"
				th:text="#{selector.month}">Month</label> <select class="select"
				name="month" id="select-month"
				th:disabled="${report.view != 'month'}">
				<option th:each="m : ${report.months}" th:value="${m.value}"
					th:text="${m.label}"
					th:selected="${report.month != null and report.month == m.value}">Jan.</option>
			</select>

			<button type="submit" class="btn" id="selector-submit"
				th:text="#{selector.submit}">Show</button>
		</form>
	</header>

	<!-- shown as long as the CSV directory holds no report and the bundled
	     sample report is displayed instead -->
	<div class="demo-banner" role="status" th:if="${demo}">
		<strong th:text="#{demo.title}">Sample data</strong> <span
			th:text="#{demo.hint}">No reports found in the CSV directory.</span>
	</div>

	<main class="content" id="content">

		<h1 class="page-title" id="page-title" th:text="${report.title}">June
			2026</h1>
		<p class="page-hint" id="page-hint" th:text="${report.hint}">Daily
			values of the month</p>

		<section class="cards" id="cards">
			<article class="card" th:each="metric : ${report.metrics}"
				th:attr="data-key=${metric.key}">
				<div class="card-label" th:text="${metric.label}">PV production</div>
				<div class="card-value">
					<span class="card-number" th:text="${metric.value}">0</span> <span
						class="card-unit" th:text="${metric.unit}">kWh</span>
				</div>
				<div class="meter" th:if="${metric.percent != null}">
					<div class="meter-fill"
						th:style="'width:' + ${#numbers.formatDecimal(metric.percent, 1, 'POINT', 1, 'POINT')} + '%'"></div>
				</div>
			</article>
		</section>

		<section class="chart-panel">
			<h2 class="panel-title" th:text="#{panel.balance.title}">Energy balance</h2>
			<div class="chart-frame">
				<img class="chart" id="chart-balance" th:alt="#{panel.balance.title}"
					th:src="@{'/chart.png?' + ${report.chartQuery}}"
					th:width="${report.chartWidth}" th:height="${report.chartHeight}"
					usemap="#chart-map">
				<!-- fallback without javascript: one area per bar, generated by
				     JFreeChart, carrying a native tool tip -->
				<span id="chart-map-holder" th:utext="${report.chartImageMap}"></span>
				<!-- all values per category plus their geometry, for the thin client -->
				<script type="application/json" id="chart-hover"
					th:utext="${@json.write(report.chartHover)}">{}</script>
			</div>
		</section>

	</main>

	<script th:src="@{/js/thin-client.js}" defer></script>
</body>
</html>
